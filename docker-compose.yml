version: '3.9'
services:
  subz-studio:
    build: .
    container_name: subz-studio
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./fontcache:/app/fontcache
      - ./logs:/app/logs
    env_file: .env
    environment:
      - DB_HOST=mysql
    networks: [subz-net]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:5000/health"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: subz-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=root_change_me
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [subz-net]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s; timeout: 5s; retries: 5; start_period: 30s

  tg-server:
    image: aiogram/telegram-bot-api:latest
    container_name: subz-tg-api
    restart: unless-stopped
    ports: ["8081:8081"]
    volumes: [./tg-data:/var/lib/telegram-bot-api]
    environment:
      - TELEGRAM_API_ID=${TG_API_ID}
      - TELEGRAM_API_HASH=${TG_API_HASH}
      - TELEGRAM_LOCAL=1
      - TELEGRAM_PORT=8081
    networks: [subz-net]

  nginx:
    image: nginx:alpine
    container_name: subz-nginx
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [subz-net]
    depends_on: [subz-studio]
    profiles: [nginx]

volumes:
  mysql_data:
networks:
  subz-net:
    driver: bridge
